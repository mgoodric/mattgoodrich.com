<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 880" font-family="Georgia, 'Times New Roman', serif">
  <!-- background -->
  <rect x="0" y="0" width="1080" height="880" fill="#F4F1E8"/>

  <!-- quadrant tints -->
  <rect x="565" y="95" width="455" height="300" fill="#6A3FA0" opacity="0.07"/>
  <rect x="120" y="395" width="445" height="300" fill="#2B2B2B" opacity="0.04"/>

  <!-- weigh most / least tags -->
  <text x="1006" y="122" text-anchor="end" font-style="italic" font-size="17" fill="#6A3FA0">weigh most</text>
  <text x="134" y="682" font-style="italic" font-size="17" fill="#6B6B6B">weigh least</text>

  <!-- axis frame -->
  <rect x="120" y="95" width="900" height="600" fill="none" stroke="#2B2B2B" stroke-width="2.5"/>
  <line x1="565" y1="95" x2="565" y2="695" stroke="#2B2B2B" stroke-width="1.5"/>
  <line x1="120" y1="395" x2="1020" y2="395" stroke="#2B2B2B" stroke-width="1.5"/>

  <!-- axis labels -->
  <text x="343" y="738" text-anchor="middle" font-size="19" letter-spacing="2" fill="#2B2B2B">REPLACEABLE</text>
  <text x="797" y="738" text-anchor="middle" font-size="19" letter-spacing="2" fill="#2B2B2B">IRREPLACEABLE</text>
  <text x="66" y="245" text-anchor="middle" font-size="19" letter-spacing="2" fill="#2B2B2B" transform="rotate(-90 66 245)">CERTAIN</text>
  <text x="66" y="545" text-anchor="middle" font-size="19" letter-spacing="2" fill="#2B2B2B" transform="rotate(-90 66 545)">UNCERTAIN</text>

  <!-- TOP-LEFT: replaceable + certain (gains) -->
  <circle cx="146" cy="151" r="5" fill="#B5651D"/>
  <text x="160" y="157" font-size="18" fill="#2B2B2B">Diversity and culture</text>
  <circle cx="146" cy="187" r="5" fill="#B5651D"/>
  <text x="160" y="193" font-size="18" fill="#2B2B2B">A car-free life</text>

  <!-- TOP-RIGHT: irreplaceable + certain (expensive corner) -->
  <circle cx="591" cy="151" r="5" fill="#6A3FA0"/>
  <text x="605" y="157" font-size="18" fill="#2B2B2B">The school with no equivalent</text>
  <circle cx="591" cy="187" r="5" fill="#6A3FA0"/>
  <text x="605" y="193" font-size="18" fill="#2B2B2B">The promise to the kids</text>
  <circle cx="591" cy="223" r="5" fill="#6A3FA0"/>
  <text x="605" y="229" font-size="18" fill="#2B2B2B">A year a kid only gets once</text>
  <circle cx="591" cy="259" r="5" fill="#6A3FA0"/>
  <text x="605" y="265" font-size="18" fill="#2B2B2B">The airplane</text>
  <circle cx="591" cy="295" r="5" fill="#6A3FA0"/>
  <text x="605" y="301" font-size="18" fill="#2B2B2B">The sunrise</text>
  <circle cx="591" cy="345" r="5" fill="#B5651D"/>
  <text x="605" y="351" font-size="18" fill="#2B2B2B">The career step</text>

  <!-- BOTTOM-LEFT: replaceable + uncertain (cheap corner) -->
  <circle cx="146" cy="451" r="5" fill="#B5651D"/>
  <text x="160" y="457" font-size="18" fill="#2B2B2B">The money, mostly a bet</text>
  <circle cx="146" cy="487" r="5" fill="#B5651D"/>
  <text x="160" y="493" font-size="18" fill="#2B2B2B">Bonuses that might land or compress</text>

  <!-- BOTTOM-RIGHT: irreplaceable + uncertain -->
  <circle cx="591" cy="451" r="5" fill="#B5651D"/>
  <text x="605" y="457" font-size="18" fill="#2B2B2B">The New York life we wanted, untested</text>

  <!-- legend -->
  <circle cx="343" cy="795" r="6" fill="#6A3FA0"/>
  <text x="357" y="801" font-size="18" fill="#2B2B2B">What we'd give up</text>
  <circle cx="620" cy="795" r="6" fill="#B5651D"/>
  <text x="634" y="801" font-size="18" fill="#2B2B2B">What we'd gain</text>
</svg>
